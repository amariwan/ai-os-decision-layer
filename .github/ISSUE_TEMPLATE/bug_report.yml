name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Observed vs. expected behavior, with exact commands and output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest synthetic steps or fixture that reproduce the issue. No real user data, prompts, or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version tested
    validations:
      required: true
